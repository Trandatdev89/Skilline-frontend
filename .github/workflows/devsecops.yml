# ==================================================================
# DevSecOps Pipeline - Frontend (VueJS)
# npm ci + build -> semgrep --test -> semgrep scan -> Quality Gate -> artifact
# ==================================================================
name: DevSecOps Pipeline - Frontend

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  SEMGREP_VERSION: "1.183.0"
  PYYAML_VERSION: "6.0.3"

jobs:
  # ── Buoc 1-3: checkout, Node.js 22, cai dat + build (fail fast) ──
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Build (vite build)
        run: npm run build-only

  # ── Buoc 4-6: Semgrep + Quality Gate ─────────────────────────────
  security-scan:
    name: security-scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep + PyYAML (ghim phien ban)
        run: pip install "semgrep==${SEMGREP_VERSION}" "pyyaml==${PYYAML_VERSION}"

      - name: Test custom rules (semgrep --test)
        run: semgrep --test --metrics=off semgrep-rules/

      - name: Run Semgrep scan (vuejs-xss.yaml -> src/)
        run: |
          semgrep scan \
            --metrics=off \
            --config semgrep-rules/vuejs-xss.yaml \
            --json --output semgrep-report.json \
            src/

      - name: Run custom Quality Gate
        run: python scripts/quality_gate.py semgrep-report.json --config threshold.yaml

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-frontend
          path: |
            semgrep-report.json
            quality-gate-result.json
          retention-days: 30
